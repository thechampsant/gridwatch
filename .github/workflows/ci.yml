name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg17.11-ts2.30.2
        env:
          POSTGRES_PASSWORD: gridwatch
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:gridwatch@localhost:55432/postgres

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: ./scripts/demo.sh
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v
