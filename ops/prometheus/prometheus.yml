global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: processor
    static_configs:
      - targets: ["processor:9101"]
  - job_name: poller
    static_configs:
      - targets: ["poller:9102"]
